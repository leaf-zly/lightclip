name: Tauri 2 Build

on:
  workflow_dispatch:
  push:
    tags:
      - v2.*

concurrency:
  group: tauri-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  package:
    name: Package Tauri Windows Assets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Source CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          do {
            $runs = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow ci.yml --commit "$env:GITHUB_SHA" --limit 1 --json status,conclusion,url | ConvertFrom-Json
            $run = $runs | Select-Object -First 1
            if ($null -ne $run -and $run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') {
                throw "Source CI failed: $($run.url)"
              }
              Write-Host "Source CI passed: $($run.url)"
              break
            }
            if ([DateTime]::UtcNow -ge $deadline) {
              throw "Timed out waiting for source CI on $env:GITHUB_SHA."
            }
            Start-Sleep -Seconds 10
          } while ($true)

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Release Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: lightclip-windows-release
          cache-on-failure: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Updater Signing Key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to create signed update artifacts.'
          }

      - name: Read Release Notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: pwsh
        run: |
          $body = Get-Content -LiteralPath 'RELEASE_NOTES.md' -Raw -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw 'RELEASE_NOTES.md must not be empty.'
          }
          $delimiter = "RELEASE_NOTES_$([Guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body.Trim() | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package Tauri App
        if: ${{ !startsWith(github.ref, 'refs/tags/v2.') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri:build

      - name: Build Signed Draft Release
        if: startsWith(github.ref, 'refs/tags/v2.')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LightClip ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --ci

      - name: Smoke Test Packaged Shortcut And Paste
        shell: pwsh
        run: ./scripts/test-packaged-shortcut.ps1 -ExecutablePath 'src-tauri/target/release/lightclip.exe'

      - name: Upload Portable Executable
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item -LiteralPath "src-tauri/target/release/lightclip.exe" -Destination "LightClip-portable-x64.exe"
          gh release upload "${{ github.ref_name }}" "LightClip-portable-x64.exe" --clobber

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lightclip-tauri-2-windows
          path: |
            src-tauri/target/release/lightclip.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/*.zip
          if-no-files-found: error
          retention-days: 7
